# The merge bar, mechanized: the same four commands CLAUDE.md requires
# before any commit, plus the vulnerability scan the lean-go.sum product
# property exists to keep trivial. Every step fails the build — no
# warn-only gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test ./... -count=1 -race

      - name: fuzz smoke (untrusted-input parsers)
        run: |
          go test ./internal/corroborate -run '^$' -fuzz FuzzCLIRecordOps -fuzztime 15s
          go test ./internal/aws -run '^$' -fuzz FuzzParseARN -fuzztime 15s
          go test ./internal/ingest -run '^$' -fuzz FuzzSplitJSONArrayOrLines -fuzztime 10s
          go test ./internal/ingest/k8s -run '^$' -fuzz FuzzIngest -fuzztime 10s
          go test ./internal/ingest/gcp -run '^$' -fuzz FuzzIngest -fuzztime 10s
          go test ./internal/ingest/azure -run '^$' -fuzz FuzzIngest -fuzztime 10s
          go test ./internal/ingest/github -run '^$' -fuzz FuzzIngest -fuzztime 10s
          go test ./internal/ingest/claudecode -run '^$' -fuzz FuzzIngest -fuzztime 10s

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # Regenerate the CycloneDX SBOM from the current module graph so the OSV
      # scan below always runs against live dependencies, never a stale committed
      # snapshot.
      - name: regenerate SBOM (CycloneDX)
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod -json -output docs/security/sbom.cdx.json

      # osv-scanner is the estate's OSV-database supply-chain gate — the same
      # google/osv-scanner-action every JS repo runs — here over go.mod and the
      # freshly-regenerated SBOM. govulncheck above adds Go-native reachability.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
